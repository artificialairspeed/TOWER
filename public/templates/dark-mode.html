<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{NOTIFICATION_HEADER}} — Deployment Notification</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #0b1220;
      font-family: Arial, Helvetica, sans-serif;
      color: #e5eefc;
    }
    .card {
      max-width: 1100px;
      margin: 0 auto;
      background: #111827;
      border: 1px solid #25324a;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
    }
    .accent {
      height: 8px;
      background: linear-gradient(90deg, #304cb2 0%, #304cb2 48%, #f9b612 48%, #f9b612 62%, #e31837 62%, #e31837 100%);
    }
    .header {
      background: #9ec5ff;
      color: #0f2447;
      padding: 18px 22px;
    }
    .header-table {
      width: 100%;
      border-collapse: collapse;
    }
    .logo-left {
      width: 160px;
      vertical-align: middle;
    }
    .logo-right {
      width: 280px;
      text-align: right;
      vertical-align: middle;
    }
    .logo-heart {
      width: 132px;
      height: auto;
      display: block;
    }
    .logo-crew {
      max-width: 260px;
      width: 100%;
      height: auto;
      display: inline-block;
    }
    .title-block {
      vertical-align: middle;
      padding: 0 14px;
    }
    .eyebrow {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.25px;
      color: #e31837;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .title {
      font-size: 24px;
      line-height: 1.2;
      font-weight: 700;
      margin: 0;
      color: #0f2447;
    }
    table.main {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    table.main th {
      background: #162238;
      color: #9ec5ff;
      text-align: left;
      font-size: 13px;
      padding: 10px 12px;
      border-bottom: 2px solid #243347;
    }
    table.main td {
      border-bottom: 1px solid #243347;
      padding: 10px 12px;
      vertical-align: top;
      font-size: 12.5pt;
      line-height: 1.45;
      color: #e5eefc;
    }
    .item-col {
      width: 20%;
      background: #0f1a2d;
      color: #9ec5ff;
      font-weight: 700;
    }
    .changes div {
      margin-bottom: 6px;
    }
    .changes div:last-child {
      margin-bottom: 0;
    }
    .changes strong {
      color: #9ec5ff;
    }
    .deployment-id {
      color: #ffffff;
    }
    .impact-list {
      margin: 0;
      padding-left: 22px;
    }
    .impact-list li {
      margin: 0 0 6px 0;
    }
    .impact-list li:last-child {
      margin-bottom: 0;
    }
    /* Placeholder styles removed - tokens are injected directly at runtime */
    @media only screen and (max-width: 700px) {
      body { padding: 8px; }
      .title { font-size: 20px; }
      .logo-right { width: 190px; }
      .logo-crew { max-width: 170px; }
      .logo-left { width: 110px; }
      .logo-heart { width: 92px; }
      table.main td, table.main th { font-size: 11pt; }
    }
  </style>
</head>
